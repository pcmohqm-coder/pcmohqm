<!doctype html>
<html lang="fa-IR" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06152d">
<title>نمونه کارها | خدمات فنی محمد</title>
<meta name="description" content="نمونه کارها و سفارش‌های انجام‌شده خدمات فنی محمد: طراحی سایت، آماده‌سازی پیج اینستاگرام، طراحی پوستر، کانال ایتا و تلگرام، تولید محتوا و فیلم تبلیغاتی.">
<link rel="canonical" href="https://pcmohqm.ir/portfolio.html">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="assets/app.css">
<style>
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:14px 0 6px;-webkit-overflow-scrolling:touch}
.cats button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;font:inherit;font-size:13px;font-weight:800;color:var(--navy);cursor:pointer}
.cats button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:10px}
.work{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(4,32,68,.07);display:flex;flex-direction:column}
.work .media{aspect-ratio:4/3;background:#eaf2fb;display:block;width:100%;object-fit:cover;border:0;cursor:zoom-in}
.work .body{padding:14px 16px 16px}.work h3{margin:0 0 4px;font-size:15px;color:var(--navy)}.work p{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.work a.visit{font-size:12.5px;font-weight:800;color:var(--blue)}
.empty{grid-column:1/-1;text-align:center;border:2px dashed #b9d0ea;border-radius:22px;padding:40px 18px;color:var(--muted);background:#fbfdff}
.empty b{display:block;color:var(--navy);font-size:17px;margin-bottom:6px}
.cta{margin-top:26px;text-align:center}.cta a{display:inline-block;background:linear-gradient(135deg,#ffe96a,#f7c900);color:var(--navy);font-weight:900;border-radius:14px;padding:12px 22px}
.lb{position:fixed;inset:0;background:rgba(3,10,22,.9);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.lb.open{display:flex}.lb img{max-width:100%;max-height:92vh;border-radius:14px}.lb button{position:absolute;top:14px;left:14px;background:#fff;border:0;border-radius:99px;width:40px;height:40px;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><div class="in"><a class="brand" href="./"><img src="assets/logo-main.png" alt="لوگوی خدمات فنی محمد"><span>خدمات فنی محمد</span></a><a class="back" href="./">بازگشت به سایت ←</a></div></div>
<main class="wrap">
  <h1>نمونه کارها و سفارش‌های مشتریان</h1>
  <p class="sub">بخشی از کارهایی که تا امروز انجام شده است. یک دسته را انتخاب کنید.</p>
  <div class="cats" id="cats" role="tablist"></div>
  <p class="sub" id="catDesc"></p>
  <div class="pgrid" id="grid"></div>
  <div class="cta"><a href="./#request">سفارش مشابه این کارها ←</a></div>
</main>
<div class="lb" id="lb"><button type="button" aria-label="بستن">✕</button><img alt=""></div>
<script src="assets/site-data.js"></script>
<script>
const $=(s)=>document.querySelector(s);
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const safeUrl=u=>/^(https?:\/\/|assets\/|uploads\/)/.test(u||'')?u:'';
let cur=(location.hash||'').slice(1); if(!PORTFOLIO.some(c=>c.id===cur)) cur=PORTFOLIO[0].id;
function renderCats(){
  $('#cats').innerHTML=PORTFOLIO.map(c=>`<button type="button" data-id="${c.id}" class="${c.id===cur?'on':''}">${c.icon} ${esc(c.title)}${c.items.length?` (${c.items.length})`:''}</button>`).join('');
  $('#cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.id;history.replaceState(null,'','#'+cur);renderCats();renderGrid()});
}
function renderGrid(){
  const c=PORTFOLIO.find(x=>x.id===cur);
  $('#catDesc').textContent=c.desc;
  if(!c.items.length){$('#grid').innerHTML=`<div class="empty"><b>نمونه‌ها به‌زودی اضافه می‌شوند</b>در این دسته نمونه‌ای ثبت نشده است. برای دیدن کارهای بیشتر یا سفارش مشابه با ما در ارتباط باشید.</div>`;return}
  $('#grid').innerHTML=c.items.map((it,i)=>{
    const img=safeUrl(it.img), vid=safeUrl(it.video), url=safeUrl(it.url);
    const media=vid?`<video class="media" src="${vid}" ${img?`poster="${img}"`:''} controls preload="none" playsinline></video>`
      :img?`<img class="media" src="${img}" alt="${esc(it.title)}" loading="lazy" data-zoom="${img}">`
      :`<div class="media" style="display:flex;align-items:center;justify-content:center;font-size:42px;cursor:default">${c.icon}</div>`;
    return `<article class="work">${media}<div class="body"><h3>${esc(it.title)}</h3>${it.desc?`<p>${esc(it.desc)}</p>`:''}${url?`<a class="visit" href="${url}" target="_blank" rel="noopener">مشاهده نمونه ←</a>`:''}</div></article>`}).join('');
  $('#grid').querySelectorAll('[data-zoom]').forEach(im=>im.onclick=()=>{$('#lb img').src=im.dataset.zoom;$('#lb').classList.add('open')});
}
$('#lb').onclick=()=>$('#lb').classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('open')});
renderCats();renderGrid();
// اگر پنل مدیریت (PHP) فعال باشد، نمونه کارها از آن خوانده می‌شود؛ وگرنه همان داده ثابت site-data.js
fetch('api/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'public_content'})})
 .then(r=>r.json()).then(d=>{ if(!d.ok) return;
   PORTFOLIO.forEach(c=>{ c.items=d.works.filter(w=>w.category===c.id).map(w=>({title:w.title,desc:w.description,
     img:w.media_type==='image'?w.file:'',video:w.media_type==='video'?w.file:'',url:w.url||''})) });
   renderCats();renderGrid(); }).catch(()=>{});
</script>
</body>
</html>
