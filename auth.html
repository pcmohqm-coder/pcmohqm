<!doctype html>
<html lang="fa-IR" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="robots" content="noindex">
<title>ورود و ثبت‌نام | خدمات فنی محمد</title>
<link rel="icon" href="assets/logo-main.png">
<style>
:root{--bg:#05060a;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--text:#eef2fa;--muted:#8f9bb3;--gold:#ffc400;--gold2:#ffe27a;--blue:#1e7bff;--cyan:#3ad0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(800px 500px at 85% -5%,rgba(30,123,255,.25),transparent 60%),radial-gradient(600px 500px at 0 100%,rgba(255,196,0,.12),transparent 60%),var(--bg);color:var(--text);font-family:"Vazirmatn","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.9}
a{color:inherit;text-decoration:none}
.box{width:min(480px,100%);border-radius:30px;padding:28px 24px;background:rgba(10,13,22,.8);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.top{text-align:center;margin-bottom:18px}.top img{width:76px;height:76px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,196,0,.5),0 0 40px rgba(255,196,0,.25)}.top h1{font-size:22px;margin:8px 0 0}.top p{margin:0;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:18px}
.tabs button{font:inherit;font-weight:800;font-size:15px;border:0;background:none;color:var(--muted);padding:10px;border-radius:12px;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#141000}
form{display:none;gap:13px}form.on{display:grid}
label{display:block;font-size:14px;font-weight:800;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}
select option{background:#0a0d16}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,196,0,.12)}
textarea{min-height:80px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;min-height:50px;border:0;border-radius:15px;font:inherit;font-weight:900;font-size:15px;cursor:pointer;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#141000;box-shadow:0 10px 28px rgba(255,196,0,.28)}
.msg{display:none;padding:12px 14px;border-radius:14px;background:rgba(58,208,255,.1);border:1px solid rgba(58,208,255,.35);color:#cdefff;font-size:14px}.msg.on{display:block}
.msg a{color:var(--gold2);font-weight:800;text-decoration:underline}
.back{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:14px}.back:hover{color:var(--gold)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="box">
  <div class="top"><a href="./"><img src="assets/logo-main.png" alt="لوگوی خدمات فنی محمد"></a><h1>خدمات فنی محمد</h1><p>ورود یا ساخت حساب کاربری</p></div>
  <div class="tabs" role="tablist"><button class="on" id="tl" role="tab">ورود</button><button id="ts" role="tab">ثبت‌نام</button></div>

  <form id="login" class="on" onsubmit="return false">
    <div><label for="lm">شماره موبایل</label><input id="lm" inputmode="numeric" placeholder="09123456789" dir="ltr" autocomplete="tel"><div class="hint">کد تأیید برای شما پیامک می‌شود.</div></div>
    <button class="btn" id="lb">دریافت کد تأیید</button>
    <div class="msg" id="lmsg"></div>
  </form>

  <form id="signup" onsubmit="return false">
    <div><label for="type">نوع حساب</label><select id="type"><option value="customer">👤 مشتری عادی (خدمات شخصی)</option><option value="seller">🏪 فروشنده / صاحب کسب‌وکار</option></select></div>
    <div class="two"><div><label for="fn">نام</label><input id="fn" autocomplete="given-name"></div><div><label for="ln">نام خانوادگی</label><input id="ln" autocomplete="family-name"></div></div>
    <div><label for="sm">شماره موبایل</label><input id="sm" inputmode="numeric" placeholder="09123456789" dir="ltr" autocomplete="tel"></div>
    <div><label for="em">ایمیل</label><input id="em" type="email" dir="ltr" autocomplete="email"></div>
    <div><label for="ds">توضیحات</label><textarea id="ds" placeholder="درباره خودت یا کسب‌وکارت بنویس..."></textarea></div>
    <button class="btn" id="sb">ثبت‌نام و دریافت کد تأیید</button>
    <div class="msg" id="smsg"></div>
  </form>
  <a class="back" href="./">← بازگشت به سایت</a>
</div>
<script>
const $=i=>document.getElementById(i);
function tab(s){$('login').classList.toggle('on',!s);$('signup').classList.toggle('on',s);$('tl').classList.toggle('on',!s);$('ts').classList.toggle('on',s);history.replaceState(null,'',s?'#signup':'#login')}
$('tl').onclick=()=>tab(false);$('ts').onclick=()=>tab(true);tab(location.hash==='#signup');
// پنل هنوز فعال نیست؛ هیچ اطلاعاتی ارسال یا ذخیره نمی‌شود.
const soon='<b>سیستم ثبت‌نام و ورود هنوز فعال نیست.</b><br>اطلاعاتی ارسال یا ذخیره نشد. فعلاً سفارش را از طریق <a href="https://t.me/bagherian07" target="_blank" rel="noopener">تلگرام</a> یا <a href="https://eitaa.com/bagherian07" target="_blank" rel="noopener">ایتا</a> ثبت کن.';
['lb','sb'].forEach(b=>$(b).onclick=()=>{const m=$(b==='lb'?'lmsg':'smsg');m.innerHTML=soon;m.classList.add('on')});
</script>
</body>
</html>
