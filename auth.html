<!doctype html>
<html lang="fa-IR" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06152d">
<title>ورود و ثبت‌نام | خدمات فنی محمد</title>
<link rel="icon" href="assets/logo-main.png">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="top"><div class="in"><a class="brand" href="./"><img src="assets/logo-main.png" alt="لوگوی خدمات فنی محمد"><span>خدمات فنی محمد</span></a><a class="back" href="./">بازگشت به سایت ←</a></div></div>
<main class="wrap"><div class="card authBox">

<!-- مرحله ۱: فرم -->
<section id="stepForm">
  <h1>به خدمات فنی محمد خوش آمدید</h1>
  <p class="sub">برای دسترسی به پنل و خدمات، وارد شوید یا ثبت‌نام کنید.</p>
  <div class="tabs" role="tablist"><button id="tabLogin" class="on" type="button">ورود</button><button id="tabSignup" type="button">ثبت‌نام</button></div>

  <form id="loginForm" novalidate>
    <label for="lid">شماره موبایل یا ایمیل</label>
    <input id="lid" class="ltr" dir="ltr" autocomplete="username" inputmode="email" placeholder="09123456789 یا name@email.com">
    <p class="note">کد تأیید برای همین شماره یا ایمیل ارسال می‌شود؛ نیازی به رمز عبور نیست.</p>
    <button class="btn" type="submit">دریافت کد ورود</button>
    <div class="msg" id="loginMsg" role="alert"></div>
  </form>

  <form id="signupForm" class="hide" novalidate>
    <label>نوع حساب</label>
    <div class="types">
      <button type="button" class="type on" data-type="customer"><b>مشتری (فرد عادی)</b><small>برای استفاده شخصی از خدمات</small></button>
      <button type="button" class="type" data-type="business"><b>فروشگاه / برند</b><small>صاحب مغازه، فروشگاه یا برند</small></button>
    </div>
    <div class="row2">
      <div><label for="fn">نام</label><input id="fn" autocomplete="given-name"></div>
      <div><label for="ln">نام خانوادگی</label><input id="ln" autocomplete="family-name"></div>
    </div>
    <div id="bizBox" class="hide"><label for="bn">نام فروشگاه یا برند</label><input id="bn"></div>
    <label for="mobile">شماره موبایل</label>
    <input id="mobile" class="ltr" dir="ltr" inputmode="tel" autocomplete="tel" placeholder="09123456789">
    <label for="email">ایمیل</label>
    <input id="email" class="ltr" dir="ltr" type="email" autocomplete="email" placeholder="name@email.com">
    <label for="desc">توضیحات <span style="font-weight:500;color:var(--muted)">(اختیاری)</span></label>
    <textarea id="desc" placeholder="مثلاً نوع فعالیت یا خدماتی که نیاز دارید"></textarea>
    <label>کد تأیید به کدام روش ارسال شود؟</label>
    <div class="chan"><label><input type="radio" name="chan" value="sms" checked> پیامک به موبایل</label><label><input type="radio" name="chan" value="email"> ایمیل</label></div>
    <label class="chk"><input type="checkbox" id="terms"><span>قوانین و شرایط استفاده از خدمات را می‌پذیرم.</span></label>
    <button class="btn" type="submit">ثبت‌نام و دریافت کد</button>
    <div class="msg" id="signupMsg" role="alert"></div>
  </form>
</section>

<!-- مرحله ۲: کد -->
<section id="stepCode" class="hide">
  <h1>کد تأیید را وارد کنید</h1>
  <p class="sub" id="codeSub"></p>
  <form id="codeForm" novalidate>
    <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="------">
    <button class="btn" type="submit">تأیید و ورود</button>
    <button class="btn sec" type="button" id="resend" disabled>ارسال دوباره کد</button>
    <button class="btn sec" type="button" id="edit">ویرایش اطلاعات</button>
    <div class="msg" id="codeMsg" role="alert"></div>
    <div class="dev" id="devBox">⚠️ حالت آزمایشی: به‌جای پیامک/ایمیل، کد شما <b id="devCode"></b> است.</div>
  </form>
</section>

</div></main>
<script src="assets/app.js"></script>
<script>
let acctType = 'customer', ctx = null, timer = null;
const tabLogin = $('#tabLogin'), tabSignup = $('#tabSignup');
function setTab(t) {
  const login = t === 'login';
  tabLogin.classList.toggle('on', login); tabSignup.classList.toggle('on', !login);
  $('#loginForm').classList.toggle('hide', !login); $('#signupForm').classList.toggle('hide', login);
}
tabLogin.onclick = () => setTab('login'); tabSignup.onclick = () => setTab('signup');
if (location.hash === '#signup') setTab('signup');
document.querySelectorAll('.type').forEach(b => b.onclick = () => {
  acctType = b.dataset.type;
  document.querySelectorAll('.type').forEach(x => x.classList.toggle('on', x === b));
  $('#bizBox').classList.toggle('hide', acctType !== 'business');
});
function goCode(target, purpose, r) {
  ctx = { target, purpose };
  $('#stepForm').classList.add('hide'); $('#stepCode').classList.remove('hide');
  const ch = r.channel === 'email' ? 'ایمیل' : 'پیامک';
  $('#codeSub').textContent = `کد ۶ رقمی از طریق ${ch} برای ${r.channel === 'email' ? target : toFa(target)} ارسال شد.`;
  $('#code').value = ''; clearMsg($('#codeMsg')); $('#code').focus();
  showDev(r); countdown(r.resend || 60);
}
function showDev(r) {
  const b = $('#devBox');
  if (r.dev_code) { $('#devCode').textContent = r.dev_code; b.style.display = 'block'; } else b.style.display = 'none';
}
function countdown(s) {
  clearInterval(timer); const btn = $('#resend'); btn.disabled = true;
  const tick = () => { if (s <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = 'ارسال دوباره کد'; return; }
    btn.textContent = `ارسال دوباره کد (${toFa(s)} ثانیه)`; s--; };
  tick(); timer = setInterval(tick, 1000);
}
async function guard(btn, fn) { btn.disabled = true; try { await fn(); } finally { btn.disabled = false; } }

$('#loginForm').onsubmit = e => { e.preventDefault(); const m = $('#loginMsg'); clearMsg(m);
  guard(e.submitter, async () => {
    const id = $('#lid').value.trim(); if (!id) return show(m, 'شماره موبایل یا ایمیل را وارد کنید.', 'err');
    const r = await api('login', { identifier: id });
    if (!r.ok) return show(m, r.error, 'err');
    goCode(r.target, 'login', r);
  }); };

$('#signupForm').onsubmit = e => { e.preventDefault(); const m = $('#signupMsg'); clearMsg(m);
  guard(e.submitter, async () => {
    const r = await api('signup', {
      account_type: acctType, first_name: $('#fn').value, last_name: $('#ln').value,
      business_name: $('#bn').value, mobile: $('#mobile').value, email: $('#email').value,
      description: $('#desc').value, channel: document.querySelector('input[name=chan]:checked').value,
      accept_terms: $('#terms').checked });
    if (!r.ok) return show(m, r.error, 'err');
    goCode(r.target, 'signup', r);
  }); };

$('#codeForm').onsubmit = e => { e.preventDefault(); const m = $('#codeMsg'); clearMsg(m);
  guard(e.submitter, async () => {
    const code = $('#code').value.trim(); if (code.length < 6) return show(m, 'کد ۶ رقمی را کامل وارد کنید.', 'err');
    const r = await api('verify', { target: ctx.target, purpose: ctx.purpose, code });
    if (!r.ok) return show(m, r.error, 'err');
    location.href = 'panel.html';
  }); };
$('#resend').onclick = async () => { const m = $('#codeMsg'); clearMsg(m);
  const r = await api('resend', { target: ctx.target, purpose: ctx.purpose });
  if (!r.ok) { if (r.wait) countdown(r.wait); return show(m, r.error, 'err'); }
  show(m, 'کد جدید ارسال شد.', 'ok'); showDev(r); countdown(r.resend || 60); };
$('#edit').onclick = () => { clearInterval(timer); $('#stepCode').classList.add('hide'); $('#stepForm').classList.remove('hide'); };
api('me').then(r => { if (r.ok) location.replace('panel.html'); });
</script>
</body>
</html>
